<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo círculo oscuro -->
  <circle cx="16" cy="16" r="16" fill="#1A1814"/>
  <!-- Sol pequeño arriba -->
  <circle cx="16" cy="8" r="2.5" fill="#EF9F27"/>
  <line x1="16" y1="4.5" x2="16" y2="3" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19" y1="5.5" x2="20" y2="4.2" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13" y1="5.5" x2="12" y2="4.2" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Figura humana (líder de pie) -->
  <!-- cabeza -->
  <circle cx="16" cy="14" r="2.2" fill="#1D9E75"/>
  <!-- cuerpo con traje (rectángulo) -->
  <rect x="13.2" y="16.5" width="5.6" height="6" rx="1" fill="#1D9E75"/>
  <!-- corbata -->
  <polygon points="16,17 16.7,18.5 16,22 15.3,18.5" fill="#EF9F27"/>
  <!-- piernas -->
  <rect x="13.5" y="22.2" width="2.2" height="4" rx="1" fill="#1D9E75"/>
  <rect x="16.3" y="22.2" width="2.2" height="4" rx="1" fill="#1D9E75"/>
  <!-- check mark pequeño (tarea completada) -->
  <circle cx="24" cy="10" r="3.5" fill="#1D9E75"/>
  <polyline points="22.3,10 23.5,11.3 25.8,8.7" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
